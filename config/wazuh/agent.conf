<!--
  Wazuh central agent configuration for the "default" group.
  Lives on SIEM01 at /var/ossec/etc/shared/default/agent.conf and is pushed to every agent in the group.
  Adds the Sysmon, PowerShell and Windows Defender channels to the Windows agent's defaults (Application, Security, System).
  Phase 4 added the Defender channel so Microsoft Defender / ASR block events (1116/1117, 1121/1122) reach the SIEM.
-->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
