title: Kerberoasting - RC4 Service Ticket for User Account
id: 9b2d1a77-3f6c-4a1e-bb21-kerberoast0rc4
status: experimental
description: Detects a Kerberos service ticket (4769) issued with RC4 encryption for a user-context service account, the classic Kerberoasting signal. Machine accounts and krbtgt are excluded.
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: Amit (SecOps AD lab)
date: 2026-10-25
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
    Status: '0x0'
  filter_machine:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not 1 of filter_*
falsepositives:
  - Legacy applications or service accounts still pinned to RC4; baseline these and alert on new or anomalous requesters
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
