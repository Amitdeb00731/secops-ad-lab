title: LSASS Memory Dump via comsvcs.dll MiniDump
id: 1a4927ea-741b-4432-b0b2-ae8a29e101ce
status: experimental
description: |
  Detects the comsvcs.dll MiniDump LOLBIN technique used to dump LSASS memory, matched on the process command line.
  Scope: this is a detection on process-creation telemetry, not a prevention control. It fires where the process
  actually launches (an unhardened host, or AV disabled). On a hardened host where LSA protection / ASR or Defender
  blocks the payload before it executes, no process-creation event is generated and this rule will not match; detect
  that case from the EDR block event instead (lab equivalent: Wazuh rule 100231 on the Defender detection).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Amit (SecOps AD lab)
date: 2026-10-25
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection
falsepositives:
  - Very rare; comsvcs MiniDump has essentially no legitimate interactive use
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
