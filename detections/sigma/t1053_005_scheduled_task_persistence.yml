title: Scheduled Task Persistence Running a Shell as SYSTEM or on Boot/Logon
id: 4a1c7e32-6b58-4d21-9f0e-2a7d8c4b1e05
status: experimental
description: >
  Detects creation of a scheduled task (Security event 4698) whose embedded task
  definition runs a command shell or scripting LOLBIN and either runs as SYSTEM
  (S-1-5-18) or re-executes on every boot or logon. This combination - an
  interpreter launched with privilege and a persistence trigger - is a common
  way adversaries survive reboots. Benign software installs also create tasks,
  so the shell-plus-persistence pairing is what raises confidence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: secops-ad-lab (Phase 4)
date: 2026/10/25
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  shell:
    TaskContent|re: '(?i)(cmd\.exe|powershell|pwsh\.exe|wscript|cscript|mshta|rundll32|regsvr32|bitsadmin|certutil|curl\.exe)'
  persistence_or_system:
    TaskContent|re: '(?i)S-1-5-18|BootTrigger|LogonTrigger|HighestAvailable'
  condition: selection and shell and persistence_or_system
falsepositives:
  - Legitimate management/deployment tooling that installs SYSTEM tasks at boot
  - Vendor installers registering update tasks (baseline and allowlist by name/path)
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
