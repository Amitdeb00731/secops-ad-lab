<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="600" fill="#0f172a">SecOps AD Lab: architecture</text>
  <text x="40" y="68" font-size="13" fill="#475569">Single 16 GB laptop · host-only network · snapshots for rollback</text>

  <!-- Lab boundary -->
  <rect x="30" y="90" width="840" height="400" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="116" font-size="13" font-weight="600" fill="#334155">Isolated lab network (no route to home network or internet)</text>

  <!-- DC01 -->
  <rect x="80" y="150" width="230" height="120" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="178" font-size="16" font-weight="600" fill="#1e3a8a">DC01</text>
  <text x="100" y="200" font-size="13" fill="#1e293b">Windows Server 2022</text>
  <text x="100" y="219" font-size="13" fill="#1e293b">AD DS + DNS · Group Policy</text>
  <text x="100" y="238" font-size="13" fill="#1e293b">Sysmon + Wazuh agent</text>
  <text x="100" y="257" font-size="12" fill="#64748b">3 GB RAM</text>

  <!-- WS01 -->
  <rect x="80" y="330" width="230" height="120" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="358" font-size="16" font-weight="600" fill="#1e3a8a">WS01</text>
  <text x="100" y="380" font-size="13" fill="#1e293b">Windows 11 Enterprise</text>
  <text x="100" y="399" font-size="13" fill="#1e293b">Domain-joined user workstation</text>
  <text x="100" y="418" font-size="13" fill="#1e293b">Sysmon + Wazuh agent</text>
  <text x="100" y="437" font-size="12" fill="#64748b">4 GB RAM</text>

  <!-- SIEM01 -->
  <rect x="560" y="150" width="270" height="120" rx="10" fill="#e3f5ec" stroke="#15803d" stroke-width="1.5"/>
  <text x="580" y="178" font-size="16" font-weight="600" fill="#14532d">SIEM01</text>
  <text x="580" y="200" font-size="13" fill="#1e293b">Wazuh all-in-one (Ubuntu)</text>
  <text x="580" y="219" font-size="13" fill="#1e293b">Indexer · server · dashboard</text>
  <text x="580" y="238" font-size="13" fill="#1e293b">Custom rules + Sigma, CIS scans</text>
  <text x="580" y="257" font-size="12" fill="#64748b">4 GB RAM</text>

  <!-- TEST01 -->
  <rect x="560" y="330" width="270" height="120" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="580" y="358" font-size="16" font-weight="600" fill="#7f1d1d">TEST01</text>
  <text x="580" y="380" font-size="13" fill="#1e293b">Linux simulation host</text>
  <text x="580" y="399" font-size="13" fill="#1e293b">Triggers Atomic Red Team tests</text>
  <text x="580" y="418" font-size="13" fill="#1e293b">Powered on only during tests</text>
  <text x="580" y="437" font-size="12" fill="#64748b">2 GB RAM</text>

  <!-- WS01 to DC01 -->
  <line x1="195" y1="330" x2="195" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="205" y="306" font-size="12" fill="#334155">Kerberos · LDAP · SMB</text>

  <!-- Logs to SIEM -->
  <line x1="312" y1="200" x2="557" y2="200" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="345" y="192" font-size="12" fill="#14532d">security + Sysmon logs (both hosts)</text>
  <path d="M312,370 C430,370 450,240 557,232" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Simulated activity -->
  <line x1="558" y1="410" x2="314" y2="410" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="370" y="428" font-size="12" fill="#7f1d1d">ATT&amp;CK-mapped test runs</text>
</svg>
